<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Universe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Comic Book Fonts */
        .font-bangers { font-family: 'Bangers', cursive; letter-spacing: 0.05em; }
        .font-comic { font-family: 'Comic Neue', cursive; font-weight: 700; }
        
        /* Comic Panel Shadows & Borders */
        .comic-shadow { box-shadow: 6px 6px 0px 0px rgba(0,0,0,1); }
        .comic-shadow-sm { box-shadow: 3px 3px 0px 0px rgba(0,0,0,1); }
        
        .comic-border { border: 4px solid black; }
        .comic-border-sm { border: 2px solid black; }

        /* Comic Book Halftone Dot Backgrounds */
        .bg-comic-dots {
            background-color: #67e8f9; /* bright cyan */
            background-image: 
                radial-gradient(#22d3ee 15%, transparent 16%), 
                radial-gradient(#22d3ee 15%, transparent 16%);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
        }

        .bg-watch-pattern {
            background-color: #4ade80; /* bright green */
            background-image: 
                radial-gradient(#22c55e 15%, transparent 15%), 
                radial-gradient(#22c55e 15%, transparent 15%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        /* AP Concentric Circle Logo */
        .ap-logo {
            width: 64px;
            height: 64px;
            background: #ef4444; /* Red outer */
            border: 3px solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 4px 4px 0 #000;
        }
        .ap-logo::before {
            content: '';
            width: 44px;
            height: 44px;
            background: #f97316; /* Orange inner */
            border: 2px solid #000;
            border-radius: 50%;
            position: absolute;
        }
        .ap-logo span {
            position: relative;
            font-family: 'Bangers', cursive;
            font-size: 40px;
            color: #9333ea; /* Purple A */
            z-index: 2;
            line-height: 1;
            margin-top: 4px;
        }

        /* Animations */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            80% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Nav Tabs */
        .nav-tab {
            transition: all 0.2s;
            transform: translateY(4px);
        }
        .nav-tab.active {
            transform: translateY(0);
            background-color: #fef08a; /* Yellow */
            z-index: 10;
        }
        .nav-tab:hover:not(.active) {
            transform: translateY(0px);
            background-color: #e2e8f0;
        }

        /* Custom Scrollbars for AP Watch */
        .hidden-scrollbar::-webkit-scrollbar { display: none; }
        .hidden-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .hover-scrollbar::-webkit-scrollbar { width: 10px; }
        .hover-scrollbar::-webkit-scrollbar-track { background: #fff; border-left: 2px solid #000; }
        .hover-scrollbar::-webkit-scrollbar-thumb { background: #FFEB3B; border: 2px solid #000; border-radius: 0px; }
        .hover-scrollbar:hover::-webkit-scrollbar-thumb { background: #FFC107; }
    </style>
</head>
<body class="min-h-screen bg-comic-dots text-black font-comic selection:bg-yellow-400 selection:text-black pb-12">

    <header class="bg-red-500 comic-border-b border-b-8 border-black pt-6 px-6 sticky top-0 z-40 shadow-[0_8px_0_0_rgba(0,0,0,1)]">

                    UNIVERSE
                </h1>
            </div>
            
            <nav class="flex space-x-1 md:space-x-3 overflow-x-auto max-w-full pb-0">
                <button onclick="switchTab('home')" id="nav-home" class="nav-tab active comic-border border-b-0 rounded-t-2xl px-6 py-2 md:py-3 font-bangers text-2xl text-black bg-white">
                    HOME

                    SERIES
                </button>
                <button onclick="switchTab('characters')" id="nav-characters" class="nav-tab comic-border border-b-0 rounded-t-2xl px-6 py-2 md:py-3 font-bangers text-2xl text-black bg-white">
                    CHARACTERS

                    WRITERS

                <button onclick="switchTab('watch')" id="nav-watch" class="nav-tab comic-border border-b-0 rounded-t-2xl px-6 py-2 md:py-3 font-bangers text-2xl text-black bg-white">
                    WATCH

                <button onclick="switchTab('games')" id="nav-games" class="nav-tab comic-border border-b-0 rounded-t-2xl px-6 py-2 md:py-3 font-bangers text-2xl text-black bg-white">
                    GAMES
                </button>
            </nav>
        </div>
    </header>

        // --- Game Engine: Florg Gem Catcher ---
        let gameAnimationId;
        let gameState = {
            isRunning: false,
            score: 0,
            player: { x: 50, y: 90, speed: 6 }, 
            items: [], 
            keys: { left: false, right: false },
            isDragging: false
        };

        const gemColors = ['#ef4444', '#a855f7', '#eab308', '#22c55e', '#3b82f6']; // Red, Purple, Yellow, Green, Blue

        function startGemCatcher() {
            const canvas = document.getElementById('game-canvas');
            if (!canvas) return;
            
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            
            gameState = {
                isRunning: true,
                score: 0,
                player: { x: canvas.width / 2, y: canvas.height - 40, speed: canvas.width > 600 ? 8 : 5 },
                items: [],
                keys: { left: false, right: false },
                isDragging: false
            };
            
            document.getElementById('game-score').innerText = '0';
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-game-btn').innerText = 'RESTART';
            
            setupGameInputs(canvas);
            cancelAnimationFrame(gameAnimationId);
            gameAnimationId = requestAnimationFrame(gameTick);
        }

        function setupGameInputs(canvas) {
            if (!canvas.dataset.inputsSetup) {
                canvas.dataset.inputsSetup = 'true';
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') gameState.keys.left = true;
                    if (e.key === 'ArrowRight') gameState.keys.right = true;
                });
                document.addEventListener('keyup', (e) => {
                    if (e.key === 'ArrowLeft') gameState.keys.left = false;
                    if (e.key === 'ArrowRight') gameState.keys.right = false;
                });
            }

            const movePlayerToTouch = (e) => {
                e.preventDefault();
                if (!gameState.isRunning) return;
                const rect = canvas.getBoundingClientRect();
                let clientX = e.touches ? e.touches.clientX : e.clientX;
                gameState.player.x = clientX - rect.left;
            };
            
            canvas.ontouchstart = movePlayerToTouch;
            canvas.ontouchmove = movePlayerToTouch;
            canvas.onmousedown = (e) => { gameState.isDragging = true; movePlayerToTouch(e); };
            canvas.onmousemove = (e) => { if (gameState.isDragging) movePlayerToTouch(e); };
            window.addEventListener('mouseup', () => gameState.isDragging = false);
        }

        function gameTick() {
            if (!gameState.isRunning) return;
            
            const canvas = document.getElementById('game-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            if (canvas.width !== canvas.clientWidth) canvas.width = canvas.clientWidth;
            if (canvas.height !== canvas.clientHeight) {
                canvas.height = canvas.clientHeight;
                gameState.player.y = canvas.height - 40; 
            }

                ctx.fillStyle = '#4ade80';

                ctx.beginPath(); ctx.arc(px, py - 14, 15, 0, Math.PI*2); ctx.fill(); ctx.stroke();

                ctx.beginPath(); ctx.arc(px + 12, py - 8, 5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#000000';
                ctx.beginPath(); ctx.arc(px + 4, py - 8, 2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + 14, py - 8, 2, 0, Math.PI*2); ctx.fill();

                ctx.lineWidth = 2.5;
                ctx.stroke();
            } else {
                ctx.fillStyle = '#86efac'; 
                ctx.beginPath();
                ctx.moveTo(px - 10, py - 10);

                ctx.lineTo(px - 40, py + 10 + standingFlap);

                ctx.lineTo(px - 10, py + 10);

                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#000000';
                ctx.stroke();

                ctx.translate(px - 23, py + 10 + (standingFlap / 2));
                ctx.rotate((standingFlap / 5) * 0.2);
                ctx.fillStyle = '#16a34a'; 
                ctx.font = 'bold 16px "Bangers"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#000000';

                ctx.fillStyle = '#4ade80'; 
                ctx.fillRect(px - 10, py - 10, 20, 30);
                ctx.strokeRect(px - 10, py - 10, 20, 30);

                ctx.beginPath(); ctx.arc(px - 12, py - 20, 16, 0, Math.PI*2); ctx.fill(); ctx.stroke();

            if (obstacleState.distance > 4000 && !obstacleState.bossSpawned) {

                ctx.strokeStyle = '#000000';

                if (Math.sqrt(Math.pow(px - bx, 2) + Math.pow(py - by, 2)) < obstacleState.player.radius + obstacleState.boss.radius) {

                let enemy = watermelonState.enemies[i];
                enemy.y += enemy.speed;
                let ex = enemy.x;
                let ey = enemy.y;
                
                ctx.lineWidth = 2.5; ctx.strokeStyle = '#000';
                
                ctx.fillStyle = '#b45309';
                ctx.fillRect(ex - 4, ey + 15, 8, 14); ctx.strokeRect(ex - 4, ey + 15, 8, 14);
                
                ctx.fillStyle = enemy.color;
                ctx.beginPath(); ctx.arc(ex, ey - 5, 14, Math.PI, 0); ctx.lineTo(ex + 14, ey + 15); ctx.lineTo(ex - 14, ey + 15); ctx.closePath(); ctx.fill(); ctx.stroke();

                ctx.strokeStyle = '#000000'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(ex - 10, ey - 2); ctx.lineTo(ex - 2, ey + 2); ctx.moveTo(ex + 10, ey - 2); ctx.lineTo(ex + 2, ey + 2); ctx.stroke();

                let enemyHit = false;
                for (let j = watermelonState.bullets.length - 1; j >= 0; j--) {
                    let b = watermelonState.bullets[j];
                    if (Math.sqrt(Math.pow(b.x - ex, 2) + Math.pow(b.y - ey, 2)) < enemy.radius + b.radius + 4) {
                        watermelonState.score += 25; 
                        document.getElementById('watermelon-score').innerText = watermelonState.score;
                        watermelonState.bullets.splice(j, 1);
                        watermelonState.enemies.splice(i, 1);
                        enemyHit = true;
                        break;
                    }
                }
                if (enemyHit) continue;
                
                if (Math.sqrt(Math.pow(watermelonState.player.x - ex, 2) + Math.pow(watermelonState.player.y - ey, 2)) < 26 + enemy.radius) { 
                    watermelonState.isRunning = false;
                    document.getElementById('watermelon-final-score').innerText = watermelonState.score;
                    document.getElementById('watermelon-game-over-screen').classList.remove('hidden');
                    return; 
                } 
                
                if (enemy.y > canvas.height + 40) watermelonState.enemies.splice(i, 1);
            }
            
            watermelonAnimationId = requestAnimationFrame(watermelonTick);
        }

        // --- Game Engine: Portal Stories: Sparks Run ---
        let sparksAnimationId;
        let sparksState = {
            isRunning: false,
            distance: 0,
            frameCount: 0,
            portalSpawned: false,
            portal: null,
            player: { x: 80, y: 0, vy: 0, isJumping: false, radius: 20 }, 
            enemies: [], 
            bullets: [],
            keys: { jump: false, shoot: false }
        };

        function startSparksGame() {
            const canvas = document.getElementById('sparks-canvas');
            if (!canvas) return;
            
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            
            sparksState = {
                isRunning: true,
                distance: 0,
                frameCount: 0,
                portalSpawned: false,
                portal: null,
                player: { x: 80, y: canvas.height - 50, vy: 0, isJumping: false, radius: 20 },
                enemies: [],
                bullets: [],
                keys: { jump: false, shoot: false }
            };
            
            document.getElementById('sparks-score').innerText = '0';
            document.getElementById('sparks-game-over-screen').classList.add('hidden');
            document.getElementById('start-sparks-btn').innerText = 'RESTART';
            
            setupSparksInputs(canvas);
            cancelAnimationFrame(sparksAnimationId);
            sparksAnimationId = requestAnimationFrame(sparksTick);
        }

        function setupSparksInputs(canvas) {
            if (!canvas.dataset.spInputsSetup) {
                canvas.dataset.spInputsSetup = 'true';
                document.addEventListener('keydown', (e) => {
                    if ((e.code === 'Space') && sparksState.isRunning) {
                        e.preventDefault();
                        sparksState.bullets.push({ x: sparksState.player.x + 20, y: sparksState.player.y, radius: 6, speed: 10 });
                    }
                    if ((e.key === 'ArrowUp') && sparksState.isRunning && !sparksState.player.isJumping) {
                        e.preventDefault();
                        sparksState.player.vy = -14;
                        sparksState.player.isJumping = true;
                    }
                });
            }

            const jumpBtn = document.getElementById('touch-sparks-jump-btn');
            const shootBtn = document.getElementById('touch-sparks-shoot-btn');

            if (jumpBtn && shootBtn) {
                const triggerJump = (e) => {
                    e.preventDefault();
                    if (sparksState.isRunning && !sparksState.player.isJumping) {
                        sparksState.player.vy = -14; sparksState.player.isJumping = true;
                    }
                };
                const triggerShoot = (e) => {
                    e.preventDefault();
                    if (sparksState.isRunning) sparksState.bullets.push({ x: sparksState.player.x + 20, y: sparksState.player.y, radius: 6, speed: 10 });
                };
                jumpBtn.ontouchstart = triggerJump; jumpBtn.onmousedown = triggerJump;
                shootBtn.ontouchstart = triggerShoot; shootBtn.onmousedown = triggerShoot;
            }
        }

        function sparksTick() {
            if (!sparksState.isRunning) return;
            
            const canvas = document.getElementById('sparks-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            if (canvas.width !== canvas.clientWidth) canvas.width = canvas.clientWidth;
            if (canvas.height !== canvas.clientHeight && !sparksState.player.isJumping) {
                canvas.height = canvas.clientHeight;
                sparksState.player.y = canvas.height - 50; 
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            sparksState.frameCount++;
            
            const groundY = canvas.height - 50;
            let speed = Math.min(8, 4 + (sparksState.distance / 1000));

            sparksState.player.y += sparksState.player.vy;
            sparksState.player.vy += 0.7; 
            
            if (sparksState.player.y >= groundY) {
                sparksState.player.y = groundY;
                sparksState.player.vy = 0;
                sparksState.player.isJumping = false;
            }

            let px = sparksState.player.x;
            let py = sparksState.player.y;

            for (let i = sparksState.bullets.length - 1; i >= 0; i--) {
                let b = sparksState.bullets[i];
                b.x += b.speed;
                ctx.fillStyle = '#f97316'; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(b.x - 2, b.y, b.radius - 2, 0, Math.PI*2); ctx.fill();
                if (b.x > canvas.width + 20) sparksState.bullets.splice(i, 1);
            }

            if (sparksState.distance >= 2800 && !sparksState.portalSpawned) {
                sparksState.portalSpawned = true;
                sparksState.portal = { x: canvas.width + 100, y: groundY - 40, radius: 70, angle: 0 };
            }

            if (sparksState.portalSpawned && sparksState.portal) {
                sparksState.portal.x -= (speed * 0.8);
                sparksState.portal.angle += 0.05;

                ctx.save();
                ctx.translate(sparksState.portal.x, sparksState.portal.y);
                ctx.rotate(sparksState.portal.angle);

                let pRadius = sparksState.portal.radius + Math.sin(sparksState.frameCount * 0.1) * 5;
                const gradient = ctx.createRadialGradient(0, 0, 5, 0, 0, pRadius);
                gradient.addColorStop(0, '#ffffff'); gradient.addColorStop(0.2, '#c084fc'); gradient.addColorStop(0.5, '#7e22ce'); gradient.addColorStop(0.8, '#2563eb'); gradient.addColorStop(1, 'transparent');

                ctx.fillStyle = gradient; ctx.beginPath(); ctx.arc(0, 0, pRadius, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 4; ctx.strokeStyle = '#60a5fa'; ctx.beginPath(); ctx.arc(0, 0, pRadius * 0.6, 0, Math.PI); ctx.stroke();
                ctx.strokeStyle = '#d8b4fe'; ctx.beginPath(); ctx.arc(0, 0, pRadius * 0.8, Math.PI, Math.PI * 2); ctx.stroke();
                ctx.restore();

                if (Math.sqrt(Math.pow(px - sparksState.portal.x, 2) + Math.pow(py - sparksState.portal.y, 2)) < sparksState.player.radius + 30) {
                    sparksState.isRunning = false;
                    document.getElementById('sparks-result-title').innerText = "VICTORY!";
                    document.getElementById('sparks-result-title').classList.replace('text-red-500', 'text-yellow-400');
                    document.getElementById('sparks-result-desc').innerText = "You reached the Portal!";
                    document.getElementById('sparks-game-over-screen').classList.remove('hidden');
                    return;
                }
            }

            ctx.save();
            ctx.translate(px, py);

            let flap = Math.sin(sparksState.frameCount * 0.3) * 10;
            ctx.lineWidth = 4; ctx.strokeStyle = '#374151'; 
            
            ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(-45, -20 + flap); ctx.lineTo(-50, 0 + flap); ctx.lineTo(-45, 20 + flap); ctx.closePath(); ctx.fillStyle = '#fbcfe8'; ctx.fill();
            ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(-45, -20 + flap); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(-50, 0 + flap); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(-45, 20 + flap); ctx.stroke(); 

            ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(45, -20 + flap); ctx.lineTo(50, 0 + flap); ctx.lineTo(45, 20 + flap); ctx.closePath(); ctx.fillStyle = '#fbcfe8'; ctx.fill();
            ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(45, -20 + flap); ctx.stroke(); ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(50, 0 + flap); ctx.stroke(); ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(45, 20 + flap); ctx.stroke(); 

            ctx.fillStyle = '#eaddcf'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.ellipse(-8, 16, 4, 7, 0.2, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(-8, 25, 3, 6, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke(); 
            ctx.fillStyle = '#6b7280'; ctx.beginPath(); ctx.moveTo(-8, 29); ctx.lineTo(-14, 34); ctx.lineTo(-10, 32); ctx.lineTo(-8, 36); ctx.lineTo(-6, 32); ctx.lineTo(-2, 34); ctx.closePath(); ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#eaddcf'; ctx.beginPath(); ctx.ellipse(8, 16, 4, 7, -0.2, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(8, 25, 3, 6, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke(); 
            ctx.fillStyle = '#6b7280'; ctx.beginPath(); ctx.moveTo(8, 29); ctx.lineTo(2, 34); ctx.lineTo(6, 32); ctx.lineTo(8, 36); 

            ctx.fillStyle = '#f3e1d4'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#e5e7eb'; 
            ctx.beginPath(); ctx.moveTo(-10, -18); ctx.quadraticCurveTo(-14, -30, -5, -28); ctx.quadraticCurveTo(-6, -22, -4, -19); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(10, -18); ctx.quadraticCurveTo(14, -30, 5, -28); ctx.quadraticCurveTo(6, -22, 4, -19); ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.ellipse(-7, -4, 4, 7, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(7, -4, 4, 7, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(-7, -8, 2.5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(7, -8, 2.5, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(0, 7, 5, 0, Math.PI, false); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-2, 7); ctx.lineTo(2, 7); ctx.lineTo(0, 10); ctx.fill(); 

            ctx.restore();

            if (!sparksState.portalSpawned) {
                if (sparksState.frameCount % Math.max(50, 120 - Math.floor(speed * 5)) === 0) {
                    if (Math.random() < 0.35) {
                        sparksState.enemies.push({ type: 'boulder', x: canvas.width + 40, y: groundY - 10, radius: 28, speedMult: 1.5 + Math.random() * 0.4, angle: 0 });
                    } else {
                        sparksState.enemies.push({ type: 'spider', x: canvas.width + 30, y: groundY + 15, radius: 15, speedMult: 1 });
                    }
                }
            }

            for (let i = sparksState.enemies.length - 1; i >= 0; i--) {
                let enemy = sparksState.enemies[i];
                enemy.x -= speed * (enemy.speedMult || 1);
                
                ctx.save();
                ctx.translate(enemy.x, enemy.y);
                
                if (enemy.type === 'boulder') {
                    enemy.angle -= 0.1 * (speed * enemy.speedMult); ctx.rotate(enemy.angle);
                    ctx.fillStyle = '#6b7280'; ctx.beginPath(); ctx.arc(0, 0, enemy.radius, 0, Math.PI*2); ctx.fill(); 
                    ctx.lineWidth = 3; ctx.strokeStyle = '#1f2937'; ctx.stroke();
                    ctx.fillStyle = '#4b5563'; ctx.beginPath(); ctx.arc(-12, -8, 6, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(10, 12, 8, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(8, -14, 4, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(-10, 15, 5, 0, Math.PI*2); ctx.fill();
                } else {
                    let wiggle = Math.sin(sparksState.frameCount * 0.5) * 5;
                    ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 3;
                    for(let side=-1; side<=1; side+=2) {
                        for(let leg=0; leg<4; leg++) { ctx.beginPath(); ctx.moveTo(side*5, 0); ctx.quadraticCurveTo(side*20, -10 + wiggle*(leg%2==0?1:-1), side*25, 15); ctx.stroke(); }
                    }
                    ctx.fillStyle = '#374151'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(-10, -5, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke(); 
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(-16, -8); ctx.lineTo(-10, -4); ctx.lineTo(-12, -2); ctx.fill(); ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(-10, -4); ctx.lineTo(-8, -2); ctx.fill();
                    ctx.translate(-15, -15); ctx.rotate(wiggle * 0.05); ctx.fillStyle = '#78350f'; ctx.fillRect(-2, -15, 4, 30); ctx.fillStyle = '#9ca3af'; ctx.beginPath(); ctx.moveTo(2, -10); ctx.lineTo(15, -15); ctx.lineTo(15, -5); ctx.fill(); ctx.stroke();
                }

                ctx.restore();

                let enemyHit = false;
                for (let j = sparksState.bullets.length - 1; j >= 0; j--) {
                    if (Math.sqrt(Math.pow(sparksState.bullets[j].x - enemy.x, 2) + Math.pow(sparksState.bullets[j].y - enemy.y, 2)) < enemy.radius + sparksState.bullets[j].radius + (enemy.type === 'spider' ? 15 : 5)) { 
                        sparksState.bullets.splice(j, 1); 
                        if (enemy.type === 'spider') { sparksState.enemies.splice(i, 1); enemyHit = true; }
                        break;
                    }
                }
                if (enemyHit) continue;
                
                let pL = sparksState.player.x - 12, pR = sparksState.player.x + 12, pT = sparksState.player.y - 15, pB = sparksState.player.y + 25;
                let oL = enemy.type === 'boulder' ? enemy.x - enemy.radius + 8 : enemy.x - 15;
                let oR = enemy.type === 'boulder' ? enemy.x + enemy.radius - 8 : enemy.x + 15;
                let oT = enemy.type === 'boulder' ? enemy.y - enemy.radius + 8 : enemy.y - 20;
                let oB = enemy.type === 'boulder' ? enemy.y + enemy.radius - 8 : enemy.y + 15;

                if (pR > oL && pL < oR && pB > oT && pT < oB) { 
                    sparksState.isRunning = false;
                    document.getElementById('sparks-result-title').innerText = "GAME OVER!";
                    document.getElementById('sparks-result-title').classList.replace('text-yellow-400', 'text-red-500');
                    document.getElementById('sparks-result-desc').innerText = enemy.type === 'boulder' ? "You got flattened by a boulder!" : "The axe-spiders got you!";
                    document.getElementById('sparks-game-over-screen').classList.remove('hidden');
                    return; 
                } 
                if (enemy.x < -60) sparksState.enemies.splice(i, 1);
            }
            
            if (!sparksState.portalSpawned) {
                sparksState.distance += Math.floor(speed);
                document.getElementById('sparks-score').innerText = sparksState.distance;
            }

            sparksAnimationId = requestAnimationFrame(sparksTick);
        }

        // --- Tab Switching Logic ---
        function switchTab(tabId) {
            document.querySelectorAll('.nav-tab').forEach(btn => {
                btn.classList.remove('active', 'bg-yellow-400');
                btn.classList.add('bg-white');
            });
            const activeBtn = document.getElementById(`nav-${tabId}`);
            if(activeBtn) {
                activeBtn.classList.add('active', 'bg-yellow-400');
                activeBtn.classList.remove('bg-white');
            }

            // Stop all games
            if (typeof gameState !== 'undefined' && tabId !== 'games') gameState.isRunning = false;
            if (typeof obstacleState !== 'undefined' && tabId !== 'games') obstacleState.isRunning = false;
            if (typeof watermelonState !== 'undefined' && tabId !== 'games') watermelonState.isRunning = false;
            if (typeof sparksState !== 'undefined' && tabId !== 'games') sparksState.isRunning = false;

            const contentDiv = document.getElementById('main-content');
            if (tabId === 'home') contentDiv.innerHTML = renderHome();
            if (tabId === 'series') contentDiv.innerHTML = renderSeries();
            if (tabId === 'characters') contentDiv.innerHTML = renderCharacters();
            if (tabId === 'writers') contentDiv.innerHTML = renderWriters();
            if (tabId === 'games') contentDiv.innerHTML = renderGames();
            if (tabId === 'watch') {
                contentDiv.innerHTML = renderWatch();
                renderWatchVideos(watchVideosData); // Inject videos right after rendering
            }
        }

        // Initialize App on load
        window.onload = () => switchTab('home');
    </script>
</body>
</html>
